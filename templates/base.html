<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Sentinel | Intrusion Detection</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><div class="brand">☁ Cloud Sentinel</div><nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('ingest') }}">Add event</a></nav></header>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>Educational cloud-security prototype · Not a production SIEM</footer></body></html>
